name: Cleanup email-campaigns scaffold
on:
  push:
    branches: [email-campaigns-os]
    paths:
      - "build-assets/email-campaigns-patches/CLEANUP"
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: email-campaigns-os
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove assemble/apply scaffolding
        run: |
          set -euo pipefail
          rm -rf build-assets/email-campaigns \
                 build-assets/email-campaigns-large \
                 build-assets/email-campaigns-large-py \
                 build-assets/email-campaigns-mid \
                 build-assets/email-campaigns-rest \
                 build-assets/email-campaigns-patches
          rm -f .github/workflows/assemble-email-campaigns.yml \
                .github/workflows/assemble-email-campaigns-large.yml \
                .github/workflows/assemble-email-campaigns-large-py.yml \
                .github/workflows/assemble-email-campaigns-mid.yml \
                .github/workflows/assemble-email-campaigns-rest.yml \
                .github/workflows/apply-campaigns-a.yml \
                .github/workflows/apply-campaigns-b.yml \
                .github/workflows/apply-campaigns-c.yml \
                .github/workflows/apply-email-campaigns-patches.yml \
                .github/workflows/cleanup-email-campaigns-scaffold.yml
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing to clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(campaigns): remove MCP assemble/apply scaffolding"
          git push
