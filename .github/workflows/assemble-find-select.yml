name: Assemble Find select owner-desk
on:
  workflow_dispatch:
    inputs:
      target:
        description: "linkedin-agent-in-app | main | both"
        required: true
        default: both
        type: choice
        options: [linkedin-agent-in-app, main, both]
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkedin-agent-in-app
          fetch-depth: 0
      - name: Assemble linkedin-agent-in-app
        if: ${{ github.event.inputs.target == 'linkedin-agent-in-app' || github.event.inputs.target == 'both' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          prefix = Path("mcp-push/find-select-owner")
          meta = json.loads((prefix / "meta.json").read_text())
          blob = "".join((prefix / f"part{i}.b64").read_text().strip() for i in range(meta["parts"]))
          raw = zlib.decompress(base64.b64decode(blob))
          assert hashlib.sha256(raw).hexdigest() == meta["sha256"]
          Path(meta["target"]).write_bytes(raw)
          print("branch owner-desk", len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/owner-desk.tsx src/components/find-vertical-field.tsx src/styles-find-select.css || true
          git diff --cached --quiet || git commit -m "fix(ux): Find Clients vertical uses native select on mobile"
          git push origin HEAD:linkedin-agent-in-app
      - name: Assemble main
        if: ${{ github.event.inputs.target == 'main' || github.event.inputs.target == 'both' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git checkout origin/linkedin-agent-in-app -- mcp-push/find-select-owner-main src/components/find-vertical-field.tsx src/styles-find-select.css || true
          python3 <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          prefix = Path("mcp-push/find-select-owner-main")
          meta = json.loads((prefix / "meta.json").read_text())
          blob = "".join((prefix / f"part{i}.b64").read_text().strip() for i in range(meta["parts"]))
          raw = zlib.decompress(base64.b64decode(blob))
          assert hashlib.sha256(raw).hexdigest() == meta["sha256"]
          Path(meta["target"]).write_bytes(raw)
          print("main owner-desk", len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/owner-desk.tsx src/components/find-vertical-field.tsx src/styles-find-select.css mcp-push/find-select-owner-main || true
          git diff --cached --quiet || git commit -m "fix(ux): Find Clients vertical uses native select on mobile"
          git push origin HEAD:main
