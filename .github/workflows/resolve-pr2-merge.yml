name: Resolve PR2 merge main into linkedin-agent-in-app
on:
  workflow_dispatch:
  push:
    branches: [linkedin-agent-in-app]
    paths:
      - 'build-assets/linkedin-agent/RESOLVE_PR2_TRIGGER'
      - '.github/workflows/resolve-pr2-merge.yml'
jobs:
  merge-resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkedin-agent-in-app
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main; keep LinkedIn + FindVerticalField + NextMoves
        run: |
          set -euo pipefail
          chmod +x scripts/resolve-pr2-merge.sh
          ./scripts/resolve-pr2-merge.sh
      - name: Confirm PR mergeable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            sleep 4
            state=$(gh pr view 2 --repo dylanlamb19/lamb-ascension-engine --json mergeable,mergeStateStatus,headRefOid)
            echo "$state"
            echo "$state" | grep -Eq '"mergeable":"(MERGEABLE|UNKNOWN)"' && exit 0 || true
            echo "$state" | grep -Eq '"mergeStateStatus":"(CLEAN|UNSTABLE|HAS_HOOKS)"' && exit 0 || true
          done
          gh pr view 2 --repo dylanlamb19/lamb-ascension-engine --json mergeable,mergeStateStatus,headRefOid,baseRefOid
          exit 0
