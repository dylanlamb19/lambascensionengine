# Retired on this repository.
#
# Production outreach is woken by dylanlamb19/lamb-ascension-engine:
# Vercel Cron in that repo, plus its Outreach Worker, which returned HTTP 200
# on 2026-11-14. This copy never had the OUTREACH_JOB_SECRET Actions secret,
# so every scheduled run failed before any HTTP call (run 801 and the rest).
# Do not schedule this file again. Adding the secret here would wake the same
# live worker a second time.
name: Outreach Worker

on:
  pull_request:
  workflow_dispatch:

jobs:
  tick:
    name: Retired — do not wake production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm this scheduler does not call production
        run: |
          set -euo pipefail
          echo "Outreach Worker in dylanlamb19/lambascensionengine is retired."
          echo "Live scheduler: dylanlamb19/lamb-ascension-engine (Vercel Cron + Outreach Worker)."
          echo "No HTTP request was made. No email was sent."
