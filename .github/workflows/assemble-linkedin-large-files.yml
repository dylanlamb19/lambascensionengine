name: Assemble large LinkedIn agent files
on:
  push:
    branches: [linkedin-agent-in-app]
    paths:
      - 'build-assets/linkedin-agent/tools-zlib/**'
      - 'build-assets/linkedin-agent/owner-zlib/**'
      - 'build-assets/linkedin-agent/ASSEMBLE_TRIGGER'
      - '.github/workflows/assemble-linkedin-large-files.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "tools | owner-desk | both"
        required: true
        default: both
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkedin-agent-in-app
          fetch-depth: 0
      - name: Assemble tools.ts (zlib+b64)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path("build-assets/linkedin-agent/tools-zlib")
          meta = json.loads((root / "meta.json").read_text())
          parts = [(root / f"part{i:02d}.b64").read_text().strip() for i in range(meta["parts"])]
          raw = zlib.decompress(base64.b64decode("".join(parts)))
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == meta["sha256"], (digest, meta["sha256"])
          pathlib.Path("src/lib/voice/tools.ts").write_bytes(raw)
          print("wrote tools.ts", len(raw), digest)
          PY
      - name: Assemble owner-desk.tsx (zlib+b64)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path("build-assets/linkedin-agent/owner-zlib")
          meta = json.loads((root / "meta.json").read_text())
          parts = [(root / f"part{i:02d}.b64").read_text().strip() for i in range(meta["parts"])]
          raw = zlib.decompress(base64.b64decode("".join(parts)))
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == meta["sha256"], (digest, meta["sha256"])
          pathlib.Path("src/components/owner-desk.tsx").write_bytes(raw)
          print("wrote owner-desk.tsx", len(raw), digest)
          PY
      - name: Commit assembled files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/voice/tools.ts src/components/owner-desk.tsx
          git rm -f --ignore-unmatch \
            src/lib/linkedin-agent/_auth_probe.txt \
            src/lib/linkedin-agent/_path_probe2.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(linkedin-agent): restore tools.ts + owner-desk.tsx via zlib assemble"
            git push origin HEAD:linkedin-agent-in-app
          fi
