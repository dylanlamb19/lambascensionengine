name: Assemble large LinkedIn agent files
on:
  workflow_dispatch:
    inputs:
      target:
        description: "tools | owner-desk | both"
        required: true
        default: both
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkedin-agent-in-app
      - name: Assemble tools.ts
        if: ${{ inputs.target == 'tools' || inputs.target == 'both' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib
          root = pathlib.Path("build-assets/linkedin-agent/tools-b64")
          meta = json.loads((root / "meta.json").read_text())
          parts = []
          for i in range(meta["parts"]):
              parts.append((root / f"part{i:02d}.b64").read_text().strip())
          raw = base64.b64decode("".join(parts))
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == meta["sha256"], (digest, meta["sha256"])
          pathlib.Path("src/lib/voice/tools.ts").write_bytes(raw)
          print("wrote tools.ts", len(raw), digest)
          PY
      - name: Assemble owner-desk.tsx
        if: ${{ inputs.target == 'owner-desk' || inputs.target == 'both' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json, pathlib
          root = pathlib.Path("build-assets/linkedin-agent/owner-b64")
          meta = json.loads((root / "meta.json").read_text())
          parts = []
          for i in range(meta["parts"]):
              parts.append((root / f"part{i:02d}.b64").read_text().strip())
          raw = base64.b64decode("".join(parts))
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == meta["sha256"], (digest, meta["sha256"])
          pathlib.Path("src/components/owner-desk.tsx").write_bytes(raw)
          print("wrote owner-desk.tsx", len(raw), digest)
          PY
      - name: Commit assembled files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/voice/tools.ts src/components/owner-desk.tsx || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(linkedin-agent): assemble tools.ts + owner-desk.tsx from chunked assets"
            git push origin HEAD:linkedin-agent-in-app
          fi
