name: Assemble large LinkedIn agent files
on:
  push:
    branches: [linkedin-agent-in-app]
    paths:
      - 'build-assets/linkedin-agent/tools-linkedin.patch'
      - 'build-assets/linkedin-agent/owner-linkedin.patch'
      - 'build-assets/linkedin-agent/tools-linkedin.patch.b64.part0'
      - 'build-assets/linkedin-agent/owner-linkedin.patch.b64.part0'
      - 'build-assets/linkedin-agent/ASSEMBLE_TRIGGER'
      - '.github/workflows/assemble-linkedin-large-files.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "tools | owner-desk | both"
        required: true
        default: both
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkedin-agent-in-app
          fetch-depth: 0
      - name: Decode patch parts if needed
        run: |
          set -euo pipefail
          cd build-assets/linkedin-agent
          if [[ ! -f tools-linkedin.patch ]]; then
            cat tools-linkedin.patch.b64.part0 tools-linkedin.patch.b64.part1 tools-linkedin.patch.b64.part2 tools-linkedin.patch.b64.part3 | base64 -d > tools-linkedin.patch
          fi
          if [[ ! -f owner-linkedin.patch ]]; then
            cat owner-linkedin.patch.b64.part0 owner-linkedin.patch.b64.part1 owner-linkedin.patch.b64.part2 owner-linkedin.patch.b64.part3 | base64 -d > owner-linkedin.patch
          fi
          wc -c tools-linkedin.patch owner-linkedin.patch
      - name: Restore tools.ts from main + linkedin patch
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/lib/voice/tools.ts > src/lib/voice/tools.ts
          patch -p1 < build-assets/linkedin-agent/tools-linkedin.patch
          python3 - <<'PY'
          import hashlib, pathlib
          raw = pathlib.Path("src/lib/voice/tools.ts").read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == "c2efbd32136bd540fb5a03d03b6f35d1cad5531baf94fe39ca2957d715ae0cd6", digest
          print("tools.ts ok", len(raw), digest)
          PY
      - name: Restore owner-desk.tsx from main + linkedin patch
        run: |
          set -euo pipefail
          git show origin/main:src/components/owner-desk.tsx > src/components/owner-desk.tsx
          patch -p1 < build-assets/linkedin-agent/owner-linkedin.patch
          python3 - <<'PY'
          import hashlib, pathlib
          raw = pathlib.Path("src/components/owner-desk.tsx").read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == "349d592e50d86c97a8cbeb304ef9c5b939ea6de79df0e9029f95e1cc05a8d2f8", digest
          print("owner-desk.tsx ok", len(raw), digest)
          PY
      - name: Commit assembled files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/voice/tools.ts src/components/owner-desk.tsx
          git rm -f --ignore-unmatch \
            src/lib/linkedin-agent/_auth_probe.txt \
            src/lib/linkedin-agent/_path_probe2.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(linkedin-agent): restore tools.ts + owner-desk.tsx via main+patch"
            git push origin HEAD:linkedin-agent-in-app
          fi
