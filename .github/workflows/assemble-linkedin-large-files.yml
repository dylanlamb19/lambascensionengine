name: Assemble large LinkedIn agent files
on:
  push:
    branches: [linkedin-agent-in-app]
    paths:
      - 'build-assets/linkedin-agent/tools-linkedin.patch'
      - 'build-assets/linkedin-agent/owner-linkedin.patch'
      - 'build-assets/linkedin-agent/ASSEMBLE_TRIGGER'
      - '.github/workflows/assemble-linkedin-large-files.yml'
  workflow_dispatch:
    inputs:
      target:
        description: "tools | owner-desk | both"
        required: true
        default: both
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkedin-agent-in-app
          fetch-depth: 0
      - name: Restore tools.ts + owner-desk.tsx from main + patches
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:src/lib/voice/tools.ts > src/lib/voice/tools.ts
          git show origin/main:src/components/owner-desk.tsx > src/components/owner-desk.tsx
          patch -p1 < build-assets/linkedin-agent/tools-linkedin.patch
          patch -p1 < build-assets/linkedin-agent/owner-linkedin.patch
          python3 <<'PY'
          import hashlib, pathlib
          checks = [
            ("src/lib/voice/tools.ts", 100574, "c2efbd32136bd540fb5a03d03b6f35d1cad5531baf94fe39ca2957d715ae0cd6"),
            ("src/components/owner-desk.tsx", 172983, "349d592e50d86c97a8cbeb304ef9c5b939ea6de79df0e9029f95e1cc05a8d2f8"),
          ]
          for path, size, digest in checks:
            raw = pathlib.Path(path).read_bytes()
            got = hashlib.sha256(raw).hexdigest()
            assert len(raw) == size and got == digest, (path, len(raw), got)
            print(path, "ok", len(raw), got)
          PY
      - name: Commit assembled files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/voice/tools.ts src/components/owner-desk.tsx
          git rm -f --ignore-unmatch \
            src/lib/linkedin-agent/_auth_probe.txt \
            src/lib/linkedin-agent/_path_probe2.txt || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(linkedin-agent): restore tools.ts + owner-desk.tsx via main+patch"
            git push origin HEAD:linkedin-agent-in-app
          fi
