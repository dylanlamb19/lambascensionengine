name: Lascengine Sentinel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  watch:
    name: Pre-merge code watcher
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:src
      - run: npm run build
        env:
          DATABASE_URL: ""
