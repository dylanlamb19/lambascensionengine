name: Apply Acquisition OS patches
on:
  workflow_dispatch:
  push:
    branches: [acquisition-os-milestone]
    paths:
      - "acq-bundle-parts/**"
      - "scripts/assemble-acquisition-os.mjs"
      - "scripts/apply-acquisition-os-patches.mjs"
      - ".github/workflows/apply-acquisition-os.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
      - name: Assemble bundled files + apply patches
        run: node scripts/assemble-acquisition-os.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "feat(acq): assemble Acquisition OS contactability/queues + wire patches"
            git push
          fi
