name: Apply Acquisition OS
on:
  workflow_dispatch:
  push:
    branches: [acquisition-os-milestone]
    paths:
      - "acq-payload-parts/**"
      - "scripts/install-acq-os-from-payload.mjs"
      - ".github/workflows/apply-acquisition-os.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
          fetch-depth: 0
      - name: Install sources from payload parts + patch
        run: node scripts/install-acq-os-from-payload.mjs
      - name: Commit assembled sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(acq): assemble Acquisition OS Parts 1-2 (+ stretch) from payload"
            git push
          fi
