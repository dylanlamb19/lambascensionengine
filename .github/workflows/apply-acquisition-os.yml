name: Apply Acquisition OS patches
on:
  workflow_dispatch:
  push:
    branches: [acquisition-os-milestone]
    paths:
      - "scripts/apply-acquisition-os-patches.mjs"
      - "src/lib/prospects/contactability.ts"
      - "src/lib/prospects/pipeline-queues.ts"
      - "src/lib/prospects/reach.ts"
      - ".github/workflows/apply-acquisition-os.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
      - name: Apply patches
        run: node scripts/apply-acquisition-os-patches.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "chore(acq): apply Acquisition OS view-filter/owner-desk/sentinel/tool patches"
            git push
          fi
