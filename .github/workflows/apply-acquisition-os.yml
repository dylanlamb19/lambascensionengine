name: Apply Acquisition OS
on:
  push:
    branches: [acquisition-os-milestone]
    paths:
      - "acq-src-chunks/**"
      - "scripts/join-acq-src-chunks.mjs"
      - "scripts/apply-acquisition-os-patches.mjs"
      - ".github/workflows/apply-acquisition-os.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
          fetch-depth: 0
      - name: Join source chunks and patch
        run: node scripts/join-acq-src-chunks.mjs
      - name: Commit assembled sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(acq): assemble Acquisition OS Parts 1-2 (+ stretch) from chunks"
            git push
          fi
