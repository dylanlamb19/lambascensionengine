name: Merge main into acquisition-os-milestone
on:
  workflow_dispatch:
  push:
    branches: [acquisition-os-milestone]
    paths:
      - "mcp-push/pr3-resolve/TRIGGER"
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge origin/main and resolve
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge origin/main --no-edit
          merge_rc=$?
          set -e
          echo "merge exit=$merge_rc"
          python3 mcp-push/pr3-resolve/run-resolve.py
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "force-theirs $f"
            git checkout --theirs -- "$f"
            git add -- "$f"
          done < <(git diff --name-only --diff-filter=U || true)
          rm -f scripts/resolve-pr3-vs-main.py
          if git grep -n '<<<<<<<' -- . ':!mcp-push' ':!acq-micro' ':!acq-bundle-parts' ':!acq-payload-parts' ':!acq-src-chunks' ':!.github/workflows' ':!scripts' 2>/dev/null; then
            echo "Unresolved conflict markers remain" >&2
            exit 1
          fi
          git add -A
          if [ -f .git/MERGE_HEAD ]; then
            git commit -m "merge(main): into acquisition-os-milestone (acq+linkedin resolve, 0019 migration, typecheck)"
          else
            git diff --cached --quiet || git commit -m "fix(acq): resolve vs main + typecheck + 0019 migration"
          fi
          git push origin HEAD:acquisition-os-milestone
