name: Merge main into acquisition-os-milestone
on:
  workflow_dispatch:
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
          fetch-depth: 0
      - name: Merge origin/main and resolve
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge origin/main --no-edit
          merge_rc=$?
          set -e
          echo "merge exit=$merge_rc"
          python3 mcp-push/pr3-resolve/run-resolve.py
          if git grep -n '<<<<<<<' -- . ':!mcp-push' ':!acq-micro' ':!acq-bundle-parts' ':!acq-payload-parts' ':!acq-src-chunks' ':!.github/workflows' 2>/dev/null; then
            echo "Unresolved conflict markers remain" >&2
            exit 1
          fi
          git add -A
          if [ -f .git/MERGE_HEAD ]; then
            git commit -m "$(cat <<'EOF'
merge(main): into acquisition-os-milestone

Resolve owner-desk / tools / view-filter for Acquisition OS + LinkedIn.
Renumber acquisition migration to 0019_*. Fix Sentinel typecheck.
EOF
)"
          else
            git diff --cached --quiet || git commit -m "fix(acq): resolve vs main + typecheck + 0019 migration"
          fi
          git push origin HEAD:acquisition-os-milestone
