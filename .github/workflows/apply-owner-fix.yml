name: Apply owner-desk typefix
on:
  push:
    branches: [acquisition-os-milestone]
    paths: ["mcp-push/owner-fix-parts/TRIGGER"]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-os-milestone
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch owner-desk and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 mcp-push/owner-fix-parts/patch-owner-inline.py
          git add src/components/owner-desk.tsx
          git diff --cached --quiet || git commit -m "fix(acq): LinkedIn hydrateAraOutput returns Record + payload JsonValue casts"
          rm -f .github/workflows/apply-owner-fix.yml
          git add -A
          git diff --cached --quiet || git commit -m "chore(acq): remove temporary apply-owner-fix workflow"
          git push origin HEAD:acquisition-os-milestone
